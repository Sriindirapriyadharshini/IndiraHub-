<!DOCTYPE html>

<html>

<head>

    <title>Login - IndiraHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


<div class="auth-box">

    <div class="logo">
        ✦ INDIRAHUB
    </div>

    <p class="small-title">
        WELCOME BACK
    </p>

    <h1>Enter the Library</h1>

    <form>

        <label>Email</label>

        <input
            type="email"
            placeholder="Enter your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            placeholder="Enter your password"
            required
        >


        <button class="button">
            Login
        </button>

    </form>


    <p>
        New to IndiraHub?
        <a href="register.html">
            Create an account
        </a>
    </p>

</div>

</body>

</html>
